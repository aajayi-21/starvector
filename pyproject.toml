[project]
name = "starvector"
version = "0.1.0"
description = "Scoring engine for a daily remote-viewing game"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.26.1",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pyarrow>=25.0.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
local-cuda = [
    "torch>=2.13",
    "torchvision>=0.28",
    "transformers>=5",
    "controlnet-aux==0.0.10",
]
local-xpu = [
    "torch>=2.13",
    "torchvision>=0.28",
    "triton-xpu>=3.7",
    "transformers>=5",
    "controlnet-aux==0.0.10",
]

[tool.uv]
conflicts = [[{ group = "local-cuda" }, { group = "local-xpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-xpu", group = "local-xpu" }]
torchvision = [{ index = "pytorch-xpu", group = "local-xpu" }]
triton-xpu = [{ index = "pytorch-xpu", group = "local-xpu" }]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
