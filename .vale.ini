# Vale configuration — ASD-STE100 (Simplified Technical English, Issue 9).
# Styles are generated from the asdste100_issue9_*.json* exports in the repo root;
# regenerate rather than hand-editing the large word lists.

StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = ASD-STE100

# Documentation and prose.
[*.{md,rst,txt}]
BasedOnStyles = ASD-STE100

# Docstrings and comments in source code (extracted by Vale's code parsers).
[*.py]
BasedOnStyles = ASD-STE100
